name: Metaworkflow
run-name: "🚀 Metaworkflow (${{ github.actor }} auf  ${{ github.repository }}@${{ github.ref_name }})"


on:
  workflow_dispatch:  # Ermoeglicht manuelles Triggern
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


# ⚠️ WICHTIG: Dem GITHUB_TOKEN Schreibrechte geben
permissions:
  contents: write
  pull-requests: write   # falls der called workflow PR-Kommentare/Reviews schreibt
  # checks: write        # nur falls notwendig
  # statuses: write      # nur falls notwendig




jobs:
  pylint:
    uses: lweruo0/workflows/.github/workflows/pylint_and_black.yml@main

  phpstan:
    uses: lweruo0/workflows/.github/workflows/phpstan_and_php_cs_fixer.yml@main

  engine-purity:
    # Engine (include/) darf keine WordPress- oder Admidio-Funktionen aufrufen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, exif
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      - name: pdftotext für den Snapshot-Vergleich
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: php tests/test-datum.php
      - run: php tests/test-joiner.php
      - run: php tests/render-rechnungen.php